name: Sync current Keylix baseline

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-current.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-keylix-community
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out community repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch canonical public baseline
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/hackelia-micrantha/keylix.git /tmp/keylix-source

      - name: Project releasable tree
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            --exclude='PUBLICATION.md' \
            /tmp/keylix-source/ ./

      - name: Commit projected baseline
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "Sync current Keylix community baseline"
          git push origin HEAD:main
