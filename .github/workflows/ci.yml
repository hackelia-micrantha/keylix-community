name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-05
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Locked dependency graph
        run: cargo fetch --locked
      - name: Dependency advisories
        shell: bash
        run: |
          cargo_deny="$(bash .github/scripts/install-cargo-deny.sh "$RUNNER_TEMP/bin")"
          "$cargo_deny" check advisories
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-features
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps

  fuzz-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action, 2026-08-05
        with:
          toolchain: nightly
      - name: Install pinned cargo-fuzz
        shell: bash
        run: |
          cargo_fuzz="$(bash .github/scripts/install-cargo-fuzz.sh "$RUNNER_TEMP/bin")"
          echo "$(dirname "$cargo_fuzz")" >> "$GITHUB_PATH"
      - name: Compile-check fuzz targets
        run: cargo +nightly check --manifest-path fuzz/Cargo.toml --bins
      - name: Discover fuzz targets
        working-directory: fuzz
        run: cargo +nightly fuzz list

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-05
        with:
          toolchain: 1.88.0
      - name: Package public crates
        run: bash scripts/release/package-public.sh
      - name: Upload package readiness evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keylix-community-package-evidence-${{ github.sha }}
          path: target/keylix-package-evidence
          if-no-files-found: error
          retention-days: 14
