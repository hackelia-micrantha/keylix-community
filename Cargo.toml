[workspace]
resolver = "2"
members = [
    "crates/keylix-core",
    "crates/keylix-dpop",
    "crates/keylix-oauth",
    "crates/keylix-http",
    "crates/keylix-observe",
    "crates/keylix-mcp",
    "crates/keylix-conformance",
    "crates/keylix-verifier",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/hackelia-micrantha/keylix-community"
homepage = "https://github.com/hackelia-micrantha/keylix-community"
authors = ["RJ"]

[workspace.dependencies]
aws-lc-rs = "1.17"
base64 = "0.22"
fs2 = "=0.4.3"
libc = "0.2"
openat = "=0.1.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xattr = { version = "=1.6.1", default-features = false }

# Publishable Keylix crates are released as one exact-version set. Path
# resolution is used inside the workspace; the version is retained in packaged
# manifests so registry consumers do not depend on repository-relative paths.
keylix-core = { version = "=0.1.0", path = "crates/keylix-core" }
keylix-dpop = { version = "=0.1.0", path = "crates/keylix-dpop" }
keylix-oauth = { version = "=0.1.0", path = "crates/keylix-oauth" }
keylix-http = { version = "=0.1.0", path = "crates/keylix-http" }
keylix-observe = { version = "=0.1.0", path = "crates/keylix-observe" }
keylix-mcp = { version = "=0.1.0", path = "crates/keylix-mcp" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
